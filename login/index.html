<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopCart Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d6cdf 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            text-align: center;
        }
        h1 { color: #2d6cdf; margin-bottom: 10px; font-size: 2.5em; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 1.1em; }
        .status {
            background: #eef4ff;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #2d6cdf;
        }
        .status h2 { color: #2d6cdf; margin-bottom: 10px; font-size: 1.3em; }
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
            color: #555;
        }
        .status-item:last-child { border-bottom: none; }
        .status-item label { font-weight: bold; color: #333; }
        .links { margin-top: 30px; }
        .links h3 { color: #333; margin-bottom: 15px; }
        .link-button {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            background: #2d6cdf;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
            font-weight: bold;
        }
        .link-button:hover { background: #1e4fb3; }
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Zara ShopCart4</h1>
        <p class="subtitle">Welcome back! Sign in to continue shopping.</p>

        <div class="status">
            <h2>Store Status</h2>
            <div class="status-item"><label>Status:</label><span style="color: #22c55e; font-weight: bold;">✓ Running</span></div>
            <div class="status-item"><label>Service:</label><span>login</span></div>
            <div class="status-item"><label>Environment:</label><span>Production</span></div>
            <div class="status-item"><label>Version:</label><span>1.0.0</span></div>
        </div>

        <div class="links">
            <h3>Explore the store</h3>
            <p style="color: #666; margin-bottom: 15px;">Customer and catalog services:</p>
            <a href="http://localhost:5000/products" class="link-button">📦 Product Catalog</a>
            <a href="http://localhost:9000" class="link-button">🧾 Orders</a>
        </div>

        <div class="footer">
            <p>Powered by Docker 🐳 | Running on AWS EKS ☁️</p>
            <p>Built with Terraform & GitHub Actions 🔄</p>
        </div>
    </div>
</body>
</html>
