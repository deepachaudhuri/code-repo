<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LWPlabs - Web Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            text-align: center;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .status {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #667eea;
        }
        
        .status h2 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
            color: #555;
        }
        
        .status-item:last-child {
            border-bottom: none;
        }
        
        .status-item label {
            font-weight: bold;
            color: #333;
        }
        
        .links {
            margin-top: 30px;
        }
        
        .links h3 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .link-button {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
            font-weight: bold;
        }
        
        .link-button:hover {
            background: #764ba2;
        }
        
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 LWPlabs</h1>
        <p class="subtitle">Containerized Web Service</p>
        
        <div class="status">
            <h2>Service Status</h2>
            <div class="status-item">
                <label>Status:</label>
                <span style="color: #22c55e; font-weight: bold;">✓ Running</span>
            </div>
            <div class="status-item">
                <label>Service:</label>
                <span>lwplabs-web</span>
            </div>
            <div class="status-item">
                <label>Environment:</label>
                <span>Production</span>
            </div>
            <div class="status-item">
                <label>Version:</label>
                <span>1.0.0</span>
            </div>
        </div>
        
        <div class="links">
            <h3>Deployed Services</h3>
            <p style="color: #666; margin-bottom: 15px;">Access other microservices:</p>
            <a href="http://localhost:5000/api/info" class="link-button">📊 API Service</a>
            <a href="http://localhost:6000" class="link-button">🔄 Worker Service</a>
        </div>
        
        <div class="footer">
            <p>Powered by Docker 🐳 | Running on AWS EKS ☁️</p>
            <p>Built with Terraform & GitHub Actions 🔄</p>
        </div>
    </div>
</body>
</html>
