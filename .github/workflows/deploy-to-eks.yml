name: Deploy to EKS

on:
  workflow_run:
    workflows: ["Build and Push to ECR"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: lwplabs-cluster
  ACCOUNT_ID: 447733314827
  NAMESPACE: default
  IMAGE_TAG: latest
  REPLICAS: 3

jobs:
  check-build-status:
    name: Check Build Status
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    steps:
      - name: Check if build succeeded
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ Build workflow failed. Skipping deployment."
            exit 1
          fi
          echo "✅ Build workflow succeeded. Proceeding with deployment."

  deploy-to-eks:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: check-build-status
    if: always() && (needs.check-build-status.result == 'success' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Create ECR credentials secret
        run: |
          echo "🔐 Creating ECR credentials secret..."
          
          # Get ECR login token
          ECR_LOGIN=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          
          # Delete existing secret if it exists
          kubectl delete secret ecr-secret \
            --namespace=${{ env.NAMESPACE }} \
            --ignore-not-found=true
          
          # Create the secret
          kubectl create secret docker-registry ecr-secret \
            --docker-server=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com \
            --docker-username=AWS \
            --docker-password="${ECR_LOGIN}" \
            --namespace=${{ env.NAMESPACE }}
          
          echo "✅ ECR credentials secret created successfully"

      - name: Verify images in ECR
        run: |
          echo "🔍 Checking images in ECR..."
          
          for service in product login order; do
            IMAGE_EXISTS=$(aws ecr describe-images \
              --repository-name lwplabs-$service \
              --image-ids imageTag=${{ env.IMAGE_TAG }} \
              --region ${{ env.AWS_REGION }} \
              --query 'imageDetails[0].imageId' 2>/dev/null || echo "NOT_FOUND")
            
            if [ "$IMAGE_EXISTS" == "NOT_FOUND" ]; then
              echo "❌ Image lwplabs-$service:${{ env.IMAGE_TAG }} not found in ECR"
              exit 1
            fi
            echo "✅ Image lwplabs-$service:${{ env.IMAGE_TAG }} found in ECR"
          done

      - name: Ensure AWS Load Balancer Controller
        run: |
          echo "🔌 Ensuring AWS Load Balancer Controller is installed..."

          VPC_ID=$(aws eks describe-cluster --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "cluster.resourcesVpcConfig.vpcId" --output text)

          # IAM role created by the eks Terraform module (aws_iam_role.aws_load_balancer_controller)
          ROLE_ARN="arn:aws:iam::${{ env.ACCOUNT_ID }}:role/${{ env.CLUSTER_NAME }}-aws-load-balancer-controller"

          helm repo add eks https://aws.github.io/eks-charts --force-update
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName=${{ env.CLUSTER_NAME }} \
            --set region=${{ env.AWS_REGION }} \
            --set vpcId=$VPC_ID \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=$ROLE_ARN \
            --wait --timeout=5m

      - name: Deploy Product service
        run: |
          kubectl apply -f deployments/product-deployment.yaml -n ${{ env.NAMESPACE }}
          kubectl set image deployment/product \
            product=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/lwplabs-product:${{ env.IMAGE_TAG }} \
            --namespace=${{ env.NAMESPACE }}
          kubectl scale deployment product --replicas=${{ env.REPLICAS }} -n ${{ env.NAMESPACE }}

      - name: Deploy Login storefront service
        run: |
          kubectl apply -f deployments/login-deployment.yaml -n ${{ env.NAMESPACE }}
          kubectl set image deployment/login \
            login=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/lwplabs-login:${{ env.IMAGE_TAG }} \
            --namespace=${{ env.NAMESPACE }}
          kubectl scale deployment login --replicas=${{ env.REPLICAS }} -n ${{ env.NAMESPACE }}

      - name: Deploy Ingress
        run: |
          kubectl apply -f deployments/ingress.yaml -n ${{ env.NAMESPACE }}

      - name: Deploy Order service
        run: |
          kubectl apply -f deployments/order-deployment.yaml -n ${{ env.NAMESPACE }}
          kubectl set image deployment/order \
            order=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/lwplabs-order:${{ env.IMAGE_TAG }} \
            --namespace=${{ env.NAMESPACE }}
          kubectl scale deployment order --replicas=${{ env.REPLICAS }} -n ${{ env.NAMESPACE }}

      - name: Force restart deployments to pull latest images
        run: |
          echo "🔄 Forcing rollout restart to pull latest images..."
          
          kubectl rollout restart deployment/product -n ${{ env.NAMESPACE }}
          kubectl rollout restart deployment/login -n ${{ env.NAMESPACE }}
          kubectl rollout restart deployment/order -n ${{ env.NAMESPACE }}
          
          echo "✅ Rollout restart initiated"

      - name: Wait for deployments to be ready
        run: |
          echo "⏳ Waiting for deployments to be ready..."

          for deployment in product login order; do
            echo ""
            echo "Checking $deployment deployment..."
            kubectl rollout status deployment/$deployment \
              -n ${{ env.NAMESPACE }} \
              --timeout=3m || {
              echo "⚠️ Rollout failed. Getting pod details..."
              kubectl get pods -n ${{ env.NAMESPACE }} -l app=$deployment -o wide
              kubectl describe pod -n ${{ env.NAMESPACE }} -l app=$deployment
              kubectl logs -n ${{ env.NAMESPACE }} -l app=$deployment --tail=50
              exit 1
            }
          done

          echo ""
          echo "✅ All deployments are ready!"

      - name: Verify pods and services
        run: |
          echo "📋 Pods in ${{ env.NAMESPACE }} namespace:"
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          
          echo ""
          echo "📋 Services in ${{ env.NAMESPACE }} namespace:"
          kubectl get svc -n ${{ env.NAMESPACE }}
          
          echo ""
          echo "📋 Ingress:"
          kubectl get ingress -n ${{ env.NAMESPACE }}

      - name: Get LoadBalancer URL
        run: |
          echo "🌐 ALB Ingress LoadBalancer:"

          INGRESS_LB=$(kubectl get ingress lwplabs-ingress \
            -n ${{ env.NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
          echo "Ingress LoadBalancer: http://$INGRESS_LB"
          echo "Storefront: http://$INGRESS_LB"
          echo "Products: http://$INGRESS_LB/products"
          echo "Orders: http://$INGRESS_LB/orders"

      - name: Deployment summary
        run: |
          echo "✅ Deployment Complete!"
          echo ""
          echo "Environment: PRODUCTION (master)"
          echo "Namespace: ${{ env.NAMESPACE }}"
          echo "Image Tag: ${{ env.IMAGE_TAG }}"
          echo "Replicas: ${{ env.REPLICAS }}"
          echo ""
          echo "Services deployed:"
          echo "  - Product API"
          echo "  - Login Storefront"
          echo "  - Order Worker"
