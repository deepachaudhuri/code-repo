name: Deploy to EKS

on:
  workflow_run:
    workflows: ["Build and Push to ECR"]
    types:
      - completed
    branches:
      - dev
      - stg
      - master
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prod

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: lwplabs-cluster
  ACCOUNT_ID: 447733314827

jobs:
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image-tag: ${{ steps.env.outputs.image-tag }}
      namespace: ${{ steps.env.outputs.namespace }}
      replicas-api: ${{ steps.env.outputs.replicas-api }}
      replicas-web: ${{ steps.env.outputs.replicas-web }}
      replicas-worker: ${{ steps.env.outputs.replicas-worker }}
    steps:
      - name: Determine environment from branch
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            REF="${{ github.event.workflow_run.head_branch }}"
            case "$REF" in
              dev)
                ENV="dev"
                ;;
              stg)
                ENV="stg"
                ;;
              master)
                ENV="prod"
                ;;
              *)
                ENV="dev"
                ;;
            esac
          fi
          
          case "$ENV" in
            dev)
              echo "environment=dev" >> $GITHUB_OUTPUT
              echo "image-tag=dev" >> $GITHUB_OUTPUT
              echo "namespace=dev" >> $GITHUB_OUTPUT
              echo "replicas-api=1" >> $GITHUB_OUTPUT
              echo "replicas-web=1" >> $GITHUB_OUTPUT
              echo "replicas-worker=1" >> $GITHUB_OUTPUT
              ;;
            stg)
              echo "environment=stg" >> $GITHUB_OUTPUT
              echo "image-tag=stg" >> $GITHUB_OUTPUT
              echo "namespace=stg" >> $GITHUB_OUTPUT
              echo "replicas-api=2" >> $GITHUB_OUTPUT
              echo "replicas-web=2" >> $GITHUB_OUTPUT
              echo "replicas-worker=1" >> $GITHUB_OUTPUT
              ;;
            prod)
              echo "environment=prod" >> $GITHUB_OUTPUT
              echo "image-tag=latest" >> $GITHUB_OUTPUT
              echo "namespace=default" >> $GITHUB_OUTPUT
              echo "replicas-api=3" >> $GITHUB_OUTPUT
              echo "replicas-web=3" >> $GITHUB_OUTPUT
              echo "replicas-worker=2" >> $GITHUB_OUTPUT
              ;;
          esac

  check-build-status:
    name: Check Build Status
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    steps:
      - name: Check if build succeeded
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ Build workflow failed. Skipping deployment."
            exit 1
          fi
          echo "✅ Build workflow succeeded. Proceeding with deployment."

  deploy-to-eks:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: determine-environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ needs.determine-environment.outputs.namespace }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create ECR credentials secret
        run: |
          echo "🔐 Creating ECR credentials secret..."
          
          # Get ECR login token
          ECR_LOGIN=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          
          # Create docker config JSON
          cat > /tmp/docker-config.json << EOF
          {
            "auths": {
              "${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com": {
                "auth": "$(echo -n "AWS:${ECR_LOGIN}" | base64 -w 0)"
              }
            }
          }
          EOF
          
          # Delete existing secret if it exists
          kubectl delete secret ecr-secret \
            --namespace=${{ needs.determine-environment.outputs.namespace }} \
            --ignore-not-found=true
          
          # Create the secret
          kubectl create secret docker-registry ecr-secret \
            --docker-server=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com \
            --docker-username=AWS \
            --docker-password="${ECR_LOGIN}" \
            --namespace=${{ needs.determine-environment.outputs.namespace }}
          
          echo "✅ ECR credentials secret created successfully"

      - name: Verify images in ECR
        run: |
          echo "🔍 Checking images in ECR..."
          
          for service in api web worker; do
            IMAGE_EXISTS=$(aws ecr describe-images \
              --repository-name lwplabs-$service \
              --image-ids imageTag=${{ needs.determine-environment.outputs.image-tag }} \
              --region ${{ env.AWS_REGION }} \
              --query 'imageDetails[0].imageId' || echo "NOT_FOUND")
            
            if [ "$IMAGE_EXISTS" == "NOT_FOUND" ]; then
              echo "❌ Image lwplabs-$service:${{ needs.determine-environment.outputs.image-tag }} not found in ECR"
              exit 1
            fi
            echo "✅ Image lwplabs-$service:${{ needs.determine-environment.outputs.image-tag }} found in ECR"
          done

      - name: Ensure AWS Load Balancer Controller
        run: |
          echo "🔌 Ensuring AWS Load Balancer Controller is installed..."

          VPC_ID=$(aws eks describe-cluster --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "cluster.resourcesVpcConfig.vpcId" --output text)

          # IAM role created by the eks Terraform module (aws_iam_role.aws_load_balancer_controller)
          ROLE_ARN="arn:aws:iam::${{ env.ACCOUNT_ID }}:role/${{ env.CLUSTER_NAME }}-aws-load-balancer-controller"

          helm repo add eks https://aws.github.io/eks-charts --force-update
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName=${{ env.CLUSTER_NAME }} \
            --set region=${{ env.AWS_REGION }} \
            --set vpcId=$VPC_ID \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=$ROLE_ARN \
            --wait --timeout=5m

      - name: Deploy API service
        run: |
          # Always apply the manifest first so Service/HPA spec changes
          # (e.g. LoadBalancer -> ClusterIP) actually get synced to the cluster
          kubectl apply -f deployments/api-deployment.yaml \
            -n ${{ needs.determine-environment.outputs.namespace }}
          kubectl set image deployment/api \
            api=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/lwplabs-api:${{ needs.determine-environment.outputs.image-tag }} \
            --namespace=${{ needs.determine-environment.outputs.namespace }}

      - name: Deploy Web service
        run: |
          kubectl apply -f deployments/web-deployment.yaml \
            -n ${{ needs.determine-environment.outputs.namespace }}
          kubectl set image deployment/web \
            web=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/lwplabs-web:${{ needs.determine-environment.outputs.image-tag }} \
            --namespace=${{ needs.determine-environment.outputs.namespace }}

      - name: Deploy Ingress
        run: |
          kubectl apply -f deployments/ingress.yaml \
            -n ${{ needs.determine-environment.outputs.namespace }}

      - name: Deploy Worker service
        run: |
          kubectl apply -f deployments/worker-deployment.yaml \
            -n ${{ needs.determine-environment.outputs.namespace }}
          kubectl set image deployment/worker \
            worker=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/lwplabs-worker:${{ needs.determine-environment.outputs.image-tag }} \
            --namespace=${{ needs.determine-environment.outputs.namespace }}

      - name: Scale deployments
        run: |
          kubectl scale deployment api \
            --replicas=${{ needs.determine-environment.outputs.replicas-api }} \
            -n ${{ needs.determine-environment.outputs.namespace }}
          
          kubectl scale deployment web \
            --replicas=${{ needs.determine-environment.outputs.replicas-web }} \
            -n ${{ needs.determine-environment.outputs.namespace }}
          
          kubectl scale deployment worker \
            --replicas=${{ needs.determine-environment.outputs.replicas-worker }} \
            -n ${{ needs.determine-environment.outputs.namespace }}

      - name: Wait for deployments to be ready
        run: |
          echo "⏳ Waiting for deployments to be ready..."
          
          for deployment in api web worker; do
            echo ""
            echo "Checking $deployment deployment..."
            kubectl rollout status deployment/$deployment \
              -n ${{ needs.determine-environment.outputs.namespace }} \
              --timeout=2m || {
              echo "⚠️ Rollout status check failed. Getting pod details..."
              kubectl get pods -n ${{ needs.determine-environment.outputs.namespace }} -l app=$deployment -o wide
              kubectl describe pod -n ${{ needs.determine-environment.outputs.namespace }} -l app=$deployment
              kubectl logs -n ${{ needs.determine-environment.outputs.namespace }} -l app=$deployment --tail=50
              exit 1
            }
          done
          
          echo ""
          echo "✅ All deployments are ready!"

      - name: Verify pods running
        if: always()
        run: |
          echo "📋 Pods in ${{ needs.determine-environment.outputs.namespace }} namespace:"
          kubectl get pods -n ${{ needs.determine-environment.outputs.namespace }} -o wide
          
          echo ""
          echo "📋 Pod Events:"
          kubectl get events -n ${{ needs.determine-environment.outputs.namespace }} --sort-by='.lastTimestamp' | tail -20
          
          echo ""
          echo "📋 Services in ${{ needs.determine-environment.outputs.namespace }} namespace:"
          kubectl get svc -n ${{ needs.determine-environment.outputs.namespace }}

      - name: Get LoadBalancer URL
        run: |
          echo "🌐 ALB Ingress LoadBalancer:"
          
          INGRESS_LB=$(kubectl get ingress lwplabs-ingress \
            -n ${{ needs.determine-environment.outputs.namespace }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
          echo "Ingress LoadBalancer: http://$INGRESS_LB"
          echo "Web (Host: lwplabs.example.com): http://$INGRESS_LB"
          echo "API (Host: api.lwplabs.example.com): http://$INGRESS_LB"
          echo "API (path /api/*, no Host header needed): http://$INGRESS_LB/api/info"

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests..."
          
          # Wait for ALB Ingress LoadBalancer hostname
          for i in {1..30}; do
            INGRESS_LB=$(kubectl get ingress lwplabs-ingress \
              -n ${{ needs.determine-environment.outputs.namespace }} \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            if [ ! -z "$INGRESS_LB" ]; then
              break
            fi
            echo "Waiting for LoadBalancer ($i/30)..."
            sleep 2
          done
          
          if [ ! -z "$INGRESS_LB" ]; then
            echo "Testing API health endpoint via Ingress..."
            curl -f -H "Host: api.lwplabs.example.com" http://$INGRESS_LB/health || echo "⚠️  Health check returned non-zero"
            echo ""
          else
            echo "⚠️  LoadBalancer IP not yet assigned (this is normal if just deployed)"
          fi

      - name: Create deployment summary
        run: |
          cat > /tmp/deployment-summary.txt << EOF
          ✅ Deployment Complete
          
          Environment: ${{ needs.determine-environment.outputs.environment }}
          Namespace: ${{ needs.determine-environment.outputs.namespace }}
          Image Tag: ${{ needs.determine-environment.outputs.image-tag }}
          
          Deployments:
          - API: ${{ needs.determine-environment.outputs.replicas-api }} replicas
          - Web: ${{ needs.determine-environment.outputs.replicas-web }} replicas
          - Worker: ${{ needs.determine-environment.outputs.replicas-worker }} replicas
          
          Commands:
          Check status:
            kubectl get all -n ${{ needs.determine-environment.outputs.namespace }}
          
          View logs:
            kubectl logs -f deployment/api -n ${{ needs.determine-environment.outputs.namespace }}
            kubectl logs -f deployment/web -n ${{ needs.determine-environment.outputs.namespace }}
            kubectl logs -f deployment/worker -n ${{ needs.determine-environment.outputs.namespace }}
          
          Port forward:
            kubectl port-forward -n ${{ needs.determine-environment.outputs.namespace }} svc/api 5000:5000
            kubectl port-forward -n ${{ needs.determine-environment.outputs.namespace }} svc/web 8080:80
          
          Rollback if needed:
            kubectl rollout undo deployment/api -n ${{ needs.determine-environment.outputs.namespace }}
          EOF
          
          cat /tmp/deployment-summary.txt

      - name: Upload deployment summary
        uses: actions/upload-artifact@v4
        with:
          name: deployment-summary
          path: /tmp/deployment-summary.txt

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-to-eks]
    if: always()
    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy-to-eks.result }}" == "success" ]; then
            echo "✅ Deployment to ${{ needs.determine-environment.outputs.environment }} succeeded!"
          else
            echo "❌ Deployment to ${{ needs.determine-environment.outputs.environment }} failed!"
            exit 1
          fi
