name: Build and Push to ECR

on:
  push:
    branches:
      - dev
      - stg
      - master
    paths:
      - 'api/**'
      - 'web/**'
      - 'worker/**'
      - '.github/workflows/build-and-push.yml'
  pull_request:
    branches:
      - dev
      - stg
      - master

env:
  AWS_REGION: us-east-1
  REGISTRY_PREFIX: app

jobs:
  setup:
    name: Setup Build Matrix
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.services }}
    steps:
      - name: Set build matrix
        id: services
        run: |
          echo "services=[\"api\", \"web\", \"worker\"]" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build and Push ${{ matrix.service }} to ECR
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        service: ${{ fromJson(needs.setup.outputs.services) }}
      fail-fast: false
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get Git info
        id: git
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine repository name
        id: repo
        run: |
          REPO_NAME="${{ env.REGISTRY_PREFIX }}-${{ matrix.service }}"
          echo "name=${REPO_NAME}" >> $GITHUB_OUTPUT

      - name: Create ECR repository if not exists
        run: |
          REPO_NAME="${{ steps.repo.outputs.name }}"
          aws ecr describe-repositories \
            --repository-names "${REPO_NAME}" \
            --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository \
            --repository-name "${REPO_NAME}" \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - name: Build, tag, and push Docker image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.repo.outputs.name }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.repo.outputs.name }}:${{ steps.git.outputs.branch }}
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.repo.outputs.name }}:sha-${{ steps.git.outputs.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.repo.outputs.name }}:${{ steps.git.outputs.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.git.outputs.timestamp }}
            VCS_REF=${{ steps.git.outputs.sha }}
            VERSION=${{ steps.git.outputs.branch }}-${{ steps.git.outputs.sha }}

      - name: Image digest
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ steps.repo.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Git SHA:** ${{ steps.git.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ steps.git.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** ${{ steps.git.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY

  test-deployment:
    name: Test Deployment Info
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/stg' || github.ref == 'refs/heads/dev')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR repositories
        run: |
          echo "## ECR Repositories" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for service in api web worker; do
            REPO_NAME="${{ env.REGISTRY_PREFIX }}-${service}"
            REPO_URL=$(aws ecr describe-repositories \
              --repository-names "${REPO_NAME}" \
              --region ${{ env.AWS_REGION }} \
              --query 'repositories[0].repositoryUri' \
              --output text 2>/dev/null || echo "Not found")
            
            if [ "${REPO_URL}" != "Not found" ]; then
              echo "- **${service}:** \`${REPO_URL}\`" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Deploy to EKS cluster using images from above repositories" >> $GITHUB_STEP_SUMMARY
          echo "2. Create Kubernetes manifests referencing these ECR images" >> $GITHUB_STEP_SUMMARY
          echo "3. Use kubectl to apply deployments" >> $GITHUB_STEP_SUMMARY

      - name: Display ECR credentials
        run: |
          echo "## Deployment Configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# AWS Region" >> $GITHUB_STEP_SUMMARY
          echo "export AWS_REGION=${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# ECR Prefix" >> $GITHUB_STEP_SUMMARY
          echo "export ECR_PREFIX=${{ env.REGISTRY_PREFIX }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Login to ECR" >> $GITHUB_STEP_SUMMARY
          echo "aws ecr get-login-password --region \${AWS_REGION} | docker login --username AWS --password-stdin \$(aws sts get-caller-identity --query Account --output text).dkr.ecr.\${AWS_REGION}.amazonaws.com" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always()
    
    steps:
      - name: Build Status
        run: |
          if [ "${{ needs.build-and-push.result }}" == "success" ]; then
            echo "✅ All services built and pushed successfully!"
            exit 0
          else
            echo "❌ Build failed!"
            exit 1
          fi
