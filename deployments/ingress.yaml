apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lwplabs-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /products
        pathType: Prefix
        backend:
          service:
            name: product
            port:
              number: 5000
      - path: /orders
        pathType: Prefix
        backend:
          service:
            name: order
            port:
              number: 9000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: login
            port:
              number: 80

  - host: shop.lwplabs.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: login
            port:
              number: 80

  - host: product.lwplabs.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: product
            port:
              number: 5000

  - host: order.lwplabs.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: order
            port:
              number: 9000

---
# Order processing is internal by default and is only used for background job execution.
# If you need metrics, expose a separate internal service instead.
