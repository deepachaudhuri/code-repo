apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  labels:
    app: product
    service: product
spec:
  replicas: 1  # Change to 2 for stg, 3 for prod
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
        service: product
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: product
        image: 447733314827.dkr.ecr.us-east-1.amazonaws.com/lwplabs-product:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP

        env:
        - name: ENVIRONMENT
          value: "development"
        - name: VERSION
          value: "1.0.0"
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name

        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2

      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: product
  labels:
    app: product
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: product
  sessionAffinity: None

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
