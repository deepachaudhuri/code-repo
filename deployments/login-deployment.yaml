apiVersion: apps/v1
kind: Deployment
metadata:
  name: login
  labels:
    app: login
    service: login
spec:
  replicas: 1  # Change to 2 for stg, 3 for prod
  selector:
    matchLabels:
      app: login
  template:
    metadata:
      labels:
        app: login
        service: login
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: login
        image: 447733314827.dkr.ecr.us-east-1.amazonaws.com/lwplabs-login:dev  # Change tag: dev -> stg -> latest
        ports:
        - containerPort: 80
          name: http
          protocol: TCP

        env:
        - name: ENVIRONMENT
          value: "development"
        - name: VERSION
          value: "1.0.0"

        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2

      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: login
  labels:
    app: login
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: login
  sessionAffinity: None

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: login-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: login
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
