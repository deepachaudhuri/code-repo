apiVersion: apps/v1
kind: Deployment
metadata:
  name: login
  labels:
    app: login
    service: login
spec:
  replicas: 1  # Change to 2 for stg, 3 for prod
  selector:
    matchLabels:
      app: login
  template:
    metadata:
      labels:
        app: login
        service: login
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: login
        image: 447733314827.dkr.ecr.us-east-1.amazonaws.com/lwplabs-login:latest  # Change tag: dev -> stg -> latest
        ports:
        - containerPort: 80
          name: http
          protocol: TCP

        env:
        - name: ENVIRONMENT
          value: "production"
        - name: VERSION
          value: "1.0.0"

        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

        # READINESS PROBE: Is the pod ready to accept user traffic?
        # Used by load balancer to decide if requests should be sent to this pod
        # If fails → pod is removed from load balancer (traffic diverted to other pods)
        # Status: Pod still running, just temporarily unavailable
        readinessProbe:
          httpGet:
            path: /                    # Simple health check - can serve static HTML?
            port: 80
          initialDelaySeconds: 5       # Quick check after startup (allows fast traffic routing)
          periodSeconds: 10            # Check every 10 seconds
          timeoutSeconds: 3
          failureThreshold: 2          # After 2 failures (20 sec), remove from LB
          # Use case: App is loading config/cache, not ready yet but will recover

        # LIVENESS PROBE: Is the pod still alive and responsive?
        # Used by Kubernetes to decide if pod should be restarted
        # If fails → pod is killed and restarted
        # Status: Pod might be stuck/frozen and needs a restart
        livenessProbe:
          httpGet:
            path: /                    # Still responding to requests?
            port: 80
          initialDelaySeconds: 30      # Longer delay before first check (let app stabilize)
          periodSeconds: 30            # Check every 30 seconds (less aggressive)
          timeoutSeconds: 5            # Allow 5 seconds for response
          failureThreshold: 3          # After 3 failures (90 sec), restart pod
          # Use case: App is completely unresponsive/frozen - needs restart

      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: login
  labels:
    app: login
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: login
  sessionAffinity: None

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: login-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: login
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
